[platformio]
default_envs = esp32dev
src_dir = firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_build.partitions = firmware/encrypted_bootloader_support/partitions.csv
build_src_filter = +<*> -<encrypted_bootloader_support/>
upload_speed = 115200
monitor_speed = 115200
